[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-soc-copilot"
version = "1.1.0"
description = "Local, evidence-grounded AI SOC CoPilot: ingest security logs, map to MITRE ATT&CK with cited evidence, build an attack graph, and generate an incident report."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Aditya" }]
dependencies = [
    "requests>=2.25",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.8",
    "pre-commit>=3.5",
]

[project.scripts]
soc-copilot = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Substantive correctness/style rules. (UP/pyupgrade modernization is left off:
# the codebase targets 3.9 and uses typing.List/Dict consistently.)
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # long log/prompt strings are intentional

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["import-untyped"]  # pyyaml ships without type stubs
# Type-check the new, fully-typed modules strictly; the legacy analysis core is
# grandfathered (covered by tests + ruff instead).
files = [
    "src/models.py",
    "src/config.py",
    "src/sanitizer.py",
    "src/attack_graph.py",
    "src/logging_setup.py",
]
